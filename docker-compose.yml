services:
  timetrack:
    build:
      context: .
      dockerfile: timetrack/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8731:8731"
    environment:
      - AUTH_DB_PATH=/auth_data/auth.db
      - OFFICE_ADMIN_PASSWORD
      - TIMETRACK_PUBLIC_URL=${TIMETRACK_PUBLIC_URL:-http://localhost:8731}
      - FAKTURACE_PUBLIC_URL=${FAKTURACE_PUBLIC_URL:-http://localhost:8732}
    volumes:
      - timetrack_data:/app/data
      - auth_data:/auth_data

  fakturace:
    build:
      context: .
      dockerfile: fakturace/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8732:8732"
    environment:
      - TIMETRACK_DB_PATH=/timetrack_data/timetrack.db
      - AUTH_DB_PATH=/auth_data/auth.db
      - OFFICE_ADMIN_PASSWORD
      - TIMETRACK_PUBLIC_URL=${TIMETRACK_PUBLIC_URL:-http://localhost:8731}
      - FAKTURACE_PUBLIC_URL=${FAKTURACE_PUBLIC_URL:-http://localhost:8732}
    volumes:
      - fakturace_data:/app/data
      - timetrack_data:/timetrack_data:ro
      - auth_data:/auth_data
    depends_on:
      - timetrack

volumes:
  timetrack_data:
  fakturace_data:
  auth_data:
